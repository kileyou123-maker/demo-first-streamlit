<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#090b11" />
<title>WHAT IF? — 另一個人生</title>
<meta name="description" content="如果人生能重來一次，你會變成誰？3 分鐘玩出你的平行人生，和朋友比結局。" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="wrap">
<header><div class="brand"><div class="mark">W?</div><div><b>WHAT IF?</b><small>PLAY YOUR OTHER LIFE</small></div></div><div class="pill">不用登入 · 3 分鐘一局</div></header>

<section id="home">
  <div class="hero"><div class="eyebrow">另一個人生，現在開始</div><h1>如果人生可以<br><i>重來一次？</i></h1><p>選一個「如果」，做 5 個決定。最後你會得到一個只有你才會走到的平行人生結局，還能丟給朋友挑戰。</p></div>
  <div class="hot" id="hot"></div>
  <form id="create" class="create">
    <label for="idea">或自己創造一個世界</label>
    <textarea id="idea" maxlength="70" placeholder="例如：如果我明天突然中了 10 億…"></textarea>
    <div class="create-foot"><span id="count">0 / 70</span><button class="primary" id="start" disabled>建立我的另一個人生 →</button></div>
  </form>
</section>

<section id="game" class="stage hidden">
  <div class="stage-head"><button id="exit" class="ghost">← 離開</button><span id="roundLabel">第 1 / 5 幕</span></div>
  <div class="progress"><i id="progress" style="width:20%"></i></div>
  <div class="world"><small>YOUR WHAT IF</small><b id="worldTitle"></b></div>
  <div class="stats" id="stats"></div>
  <div id="impact" class="impact hidden"></div>
  <article class="scene"><span id="day" class="day">DAY 01</span><span id="big" class="big">01</span><h2 id="sceneTitle"></h2><p id="sceneText"></p></article>
  <div id="choices" class="choices"></div>
</section>

<section id="result" class="result hidden">
  <div class="result-hero"><div id="rarity" class="rarity"></div><div class="kicker">YOUR PARALLEL LIFE</div><h1 id="ending"></h1><p id="endingText"></p></div>
  <div id="tags" class="tags"></div>
  <div id="compare" class="compare"></div>
  <div class="timeline"><h3>你走過的 5 個決定</h3><div id="history"></div></div>
  <div class="actions"><button id="share" class="primary">挑戰朋友</button><button id="again" class="ghost">同一題再玩一次</button><button id="newLife" class="ghost">換一個人生</button></div>
  <div class="note">朋友從你的連結進來會玩同一個題目，但可能走到完全不同的結局。</div>
</section>
<footer>WHAT IF? · INTERACTIVE LIFE SIMULATION · MVP V2</footer>
</div>
<div id="toast" class="toast">已複製挑戰連結</div>
<script src="app.js"></script>
</body>
</html>
