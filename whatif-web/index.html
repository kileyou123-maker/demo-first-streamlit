<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WHAT IF? — 玩出你的另一個人生</title><meta name="description" content="輸入一個假設，玩一場 5 回合的互動人生。"><style>
:root{--bg:#080a0f;--panel:#10141c;--line:#232a37;--text:#f5f7fb;--muted:#929bad;--accent:#b7ff3c;--accent2:#7ef0ff}*{box-sizing:border-box}html{background:var(--bg);color:var(--text);font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif}body{margin:0;background:radial-gradient(circle at 80% 0%,#17242c 0,transparent 32rem),var(--bg);min-height:100vh}.shell{width:min(100%,900px);margin:auto;padding:24px 22px 48px}.brand{display:flex;align-items:center;gap:12px;margin-bottom:64px}.logo{width:44px;height:44px;border:1px solid var(--line);display:grid;place-items:center;border-radius:13px;font-weight:900;background:#fff;color:#080a0f}.brand b{display:block;letter-spacing:.08em}.brand span{font-size:9px;letter-spacing:.22em;color:var(--muted)}.hero{max-width:760px}.eyebrow{color:var(--accent);font-size:12px;font-weight:800;letter-spacing:.15em;text-transform:uppercase}.hero h1,.result h1{font-size:clamp(45px,9vw,86px);line-height:.96;margin:18px 0 22px;letter-spacing:-.055em}.hero h1 em{font-style:normal;color:var(--accent)}.lead,.resultLead{font-size:18px;line-height:1.7;color:#b9c0cd;max-width:610px}.composer{margin:38px 0 28px;background:rgba(16,20,28,.86);border:1px solid var(--line);border-radius:22px;padding:18px}.composer label{font-size:12px;color:var(--muted);font-weight:700}.composer textarea{display:block;width:100%;min-height:110px;resize:none;background:transparent;border:0;outline:0;color:#fff;font:700 22px/1.45 inherit;padding:14px 0}.composer textarea::placeholder{color:#596273}.composerFoot{display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding-top:14px;color:var(--muted);font-size:12px}.composer button,.primary{border:0;border-radius:13px;background:var(--accent);color:#0b0d10;padding:13px 18px;font-weight:900;font-size:15px}.composer button:disabled{opacity:.35}.quick{display:flex;gap:8px;flex-wrap:wrap}.quick>span{width:100%;font-size:12px;color:var(--muted);margin-bottom:3px}.quick button,.ghost,.actions button:not(.primary){background:#10141c;border:1px solid var(--line);color:#dfe4ec;border-radius:999px;padding:10px 13px}.game{max-width:740px;margin:auto}.topbar{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px}.ghost{border-radius:10px!important}.progress{height:3px;background:#1a202a;margin:15px 0 34px}.progress i{display:block;height:100%;background:var(--accent);transition:.3s}.scenario{border-left:3px solid var(--accent);padding-left:16px;margin-bottom:20px}.scenario span{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.15em}.scenario h2{font-size:20px;margin:6px 0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:20px 0}.stats>div{padding:14px;background:#0d1118;border:1px solid var(--line);border-radius:14px}.stats span{font-size:11px;color:var(--muted)}.stats b{display:block;font-size:22px;margin:2px 0 9px}.stats i{display:block;height:3px;background:#202632}.stats u{display:block;height:100%;background:var(--accent2)}.scene{display:grid;grid-template-columns:72px 1fr;gap:22px;margin:32px 0}.sceneNum{font-size:54px;font-weight:900;color:#26303b;line-height:1}.sceneBody span{font-size:10px;letter-spacing:.2em;color:var(--accent)}.scene h3{font-size:32px;margin:7px 0 12px}.scene p{font-size:18px;line-height:1.75;color:#bdc5d1;margin:0}.choices{display:grid;gap:10px}.choices button{display:grid;grid-template-columns:38px 1fr auto;grid-template-areas:'small title arrow' 'small meta arrow';align-items:center;text-align:left;padding:16px;border-radius:16px;border:1px solid var(--line);background:#10141c;color:#fff}.choices small{grid-area:small;width:30px;height:30px;display:grid;place-items:center;border-radius:9px;background:#222a35;color:var(--accent);font-weight:900}.choices b{grid-area:title;font-size:16px}.choices span{grid-area:meta;color:var(--muted);font-size:11px;margin-top:3px}.choices strong{grid-area:arrow;font-size:22px;color:var(--muted)}button{cursor:pointer}.choices button:hover{border-color:#536071;transform:translateY(-1px)}.result{max-width:720px;margin:auto}.resultPrompt{font-size:15px;color:#b2bac7;margin-top:14px}.result h1{font-size:clamp(48px,8vw,76px);color:var(--accent);margin-top:10px}.scoreGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:34px 0}.scoreGrid div{background:#10141c;border:1px solid var(--line);border-radius:15px;padding:16px}.scoreGrid .champ{border-color:var(--accent)}.scoreGrid span{font-size:11px;color:var(--muted)}.scoreGrid b{display:block;font-size:28px;margin-top:3px}.timeline{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:22px 0;margin:28px 0}.timeline h3{font-size:12px;color:var(--muted);letter-spacing:.1em}.timeline div{display:flex;gap:16px;padding:10px 0}.timeline span{color:#525d6b;font-weight:900}.timeline b{font-size:14px}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{border-radius:12px!important;padding:13px 16px!important;font-weight:800}.shareHint{font-size:12px;color:var(--muted)}footer{margin-top:70px;padding-top:18px;border-top:1px solid #161b24;color:#4d5664;font-size:9px;letter-spacing:.18em}.hidden{display:none!important}@media(max-width:560px){.shell{padding:18px 16px 36px}.brand{margin-bottom:44px}.hero h1{font-size:50px}.lead{font-size:16px}.composer{margin-top:28px}.composer textarea{font-size:19px}.scene{grid-template-columns:1fr;gap:8px}.sceneNum{font-size:26px}.scene h3{font-size:28px}.scene p{font-size:16px}.stats>div{padding:11px}.stats b{font-size:18px}.scoreGrid{grid-template-columns:repeat(2,1fr)}.choices button{padding:14px}.result h1{font-size:49px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><main class="shell"><header class="brand"><div class="logo">W?</div><div><b>WHAT IF?</b><span>PLAY YOUR OTHER LIFE</span></div></header>
<section id="home" class="hero"><div class="eyebrow">互動人生生成器 · MVP</div><h1>如果人生可以<br><em>重開一條時間線？</em></h1><p class="lead">輸入一個「如果」，立刻玩一場 5 回合的平行人生。每個選擇都會改變你的結局。</p><form id="form" class="composer"><label for="idea">你的 What If？</label><textarea id="idea" placeholder="例如：如果我今天突然中了 10 億…" maxlength="80"></textarea><div class="composerFoot"><span id="count">0/80</span><button id="startBtn" disabled>開始這條人生 →</button></div></form><div class="quick"><span>不知道要玩什麼？</span><button data-preset="如果我今天突然中了 10 億">如果我中了 10 億</button><button data-preset="如果台北突然停電 30 天">台北停電 30 天</button><button data-preset="如果我回到 18 歲重新選一次">回到 18 歲</button><button data-preset="如果我醒來到了 2077 年">醒在 2077 年</button></div></section>
<section id="game" class="game hidden"><div class="topbar"><button id="leave" class="ghost">← 離開</button><span id="roundLabel">第 1 / 5 回合</span></div><div class="progress"><i id="progress" style="width:20%"></i></div><div class="scenario"><span>你的時間線</span><h2 id="scenario"></h2></div><div class="stats"><div><span>金錢</span><b id="money">50</b><i><u id="moneyBar" style="width:50%"></u></i></div><div><span>幸福</span><b id="happy">50</b><i><u id="happyBar" style="width:50%"></u></i></div><div><span>人氣</span><b id="fame">50</b><i><u id="fameBar" style="width:50%"></u></i></div></div><article class="scene"><div id="sceneNum" class="sceneNum">01</div><div class="sceneBody"><span>NOW</span><h3 id="sceneTitle"></h3><p id="sceneText"></p></div></article><div id="choices" class="choices"></div></section>
<section id="result" class="result hidden"><span class="eyebrow">YOUR OTHER LIFE</span><p id="resultPrompt" class="resultPrompt"></p><h1 id="ending"></h1><p class="resultLead">你走完了這條時間線。沒有標準答案，只有每次選擇累積出的另一種人生。</p><div id="scoreGrid" class="scoreGrid"></div><div class="timeline"><h3>你的 5 個選擇</h3><div id="history"></div></div><div class="actions"><button id="share" class="primary">分享我的結局</button><button id="again">再玩一次</button><button id="newLife">開新人生</button></div><p class="shareHint">分享出去，看看朋友會不會做出完全不同的選擇。</p></section><footer>WHAT IF? · WEB MVP · NO INSTALL NEEDED</footer></main>
<script>
const EVENTS=[{title:'第一個決定來了',text:'消息是真的。你的生活在 10 分鐘內完全變了。手機不斷震動，而你必須先決定第一步。',choices:[['低調觀察','理性','金錢'],['立刻行動','勇氣','人氣'],['先找最信任的人','關係','幸福']]},{title:'意外的邀請',text:'一個你沒有預期的人突然聯絡你，提出一個看起來很誘人的機會。時間只給你 30 秒。',choices:[['答應試試','勇氣','人氣'],['先查清楚','理性','金錢'],['婉拒','幸福','關係']]},{title:'事情開始失控',text:'你的選擇被更多人知道了。有人支持你，也有人開始質疑你。',choices:[['正面回應','人氣','勇氣'],['保持沉默','理性','幸福'],['反過來利用話題','金錢','人氣']]},{title:'最難的一關',text:'你現在必須在「更大的成功」和「比較舒服的生活」之間做決定。',choices:[['全力衝刺','金錢','勇氣'],['維持平衡','幸福','理性'],['跟重要的人一起決定','關係','幸福']]},{title:'最後的選擇',text:'五年後的你回頭看今天。最後這一步，會決定這條時間線留下什麼。',choices:[['留下成就','金錢','人氣'],['留下自由','幸福','勇氣'],['留下關係','關係','幸福']]}];
let scenario='',round=0,history=[],stats={金錢:50,幸福:50,人氣:50,理性:50,勇氣:50,關係:50},seed=0;const $=s=>document.querySelector(s);function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return Math.abs(h)}function clamp(n){return Math.max(0,Math.min(100,n))}function screen(id){['home','game','result'].forEach(x=>$('#'+x).classList.toggle('hidden',x!==id))}function start(text){scenario=(text||$('#idea').value).trim();if(!scenario)return;seed=hash(scenario);round=0;history=[];stats={金錢:50,幸福:50,人氣:50,理性:50,勇氣:50,關係:50};screen('game');render()}function render(){const e=EVENTS[round];$('#roundLabel').textContent=`第 ${round+1} / 5 回合`;$('#progress').style.width=((round+1)/5*100)+'%';$('#scenario').textContent=scenario;$('#sceneNum').textContent='0'+(round+1);$('#sceneTitle').textContent=e.title;$('#sceneText').textContent=e.text;[['money','金錢'],['happy','幸福'],['fame','人氣']].forEach(([id,k])=>{$('#'+id).textContent=stats[k];$('#'+id+'Bar').style.width=stats[k]+'%'});const box=$('#choices');box.innerHTML='';e.choices.forEach((c,i)=>{const b=document.createElement('button');b.type='button';b.innerHTML=`<small>${String.fromCharCode(65+i)}</small><b>${c[0]}</b><span>可能影響 ${c[1]}・${c[2]}</span><strong>→</strong>`;b.addEventListener('click',()=>choose(c,i));box.appendChild(b)})}function choose(c,i){const a=8+((seed+round*7+i*3)%7),b=5+((seed+round*11+i*5)%6);stats[c[1]]=clamp(stats[c[1]]+a);stats[c[2]]=clamp(stats[c[2]]+b);history.push({round:round+1,label:c[0]});if(round===4)showResult();else{round++;render();scrollTo({top:0,behavior:'smooth'})}}function showResult(){screen('result');const top=Object.entries(stats).sort((a,b)=>b[1]-a[1]),k=top[0][0],map={幸福:'自由人生玩家',金錢:'高風險人生贏家',人氣:'話題中心人物',關係:'人生連結者',勇氣:'時間線冒險家',理性:'冷靜世界改寫者'};$('#resultPrompt').textContent=scenario;$('#ending').textContent=map[k]||'平行人生玩家';$('#scoreGrid').innerHTML=top.slice(0,4).map((x,i)=>`<div class="${i?'':'champ'}"><span>${x[0]}</span><b>${x[1]}</b></div>`).join('');$('#history').innerHTML=history.map(h=>`<div><span>0${h.round}</span><b>${h.label}</b></div>`).join('');window._ending=map[k]||'平行人生玩家';window._top=top[0]}
$('#idea').addEventListener('input',e=>{$('#count').textContent=e.target.value.length+'/80';$('#startBtn').disabled=!e.target.value.trim()});$('#form').addEventListener('submit',e=>{e.preventDefault();start()});document.querySelectorAll('[data-preset]').forEach(b=>b.addEventListener('click',()=>start(b.dataset.preset)));$('#leave').addEventListener('click',()=>screen('home'));$('#again').addEventListener('click',()=>start(scenario));$('#newLife').addEventListener('click',()=>{$('#idea').value='';$('#count').textContent='0/80';$('#startBtn').disabled=true;screen('home')});$('#share').addEventListener('click',async()=>{const t=`我玩了「${scenario}」\n結局：${window._ending}\n最高屬性：${window._top[0]} ${window._top[1]}\n你會做出一樣的選擇嗎？`;try{if(navigator.share)await navigator.share({title:'WHAT IF?',text:t,url:location.href});else if(navigator.clipboard){await navigator.clipboard.writeText(t+'\n'+location.href);alert('結果已複製')}else alert(t)}catch(e){}});
</script></body></html>
