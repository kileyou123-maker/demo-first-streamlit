name: Sync ETF catalog

on:
  push:
    branches: [etf-xray-mvp]
    paths:
      - "scripts/sync_etf_catalog.py"
      - ".github/workflows/sync-etf-catalog.yml"
  workflow_dispatch:
  schedule:
    - cron: "20 7 * * 1-5"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build official ETF catalog
        run: python scripts/sync_etf_catalog.py
      - name: Commit catalog when changed
        run: |
          if [ -z "$(git status --porcelain -- etf-xray/catalog.json)" ]; then
            echo "Catalog already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add etf-xray/catalog.json
          git commit -m "Sync ETF catalog"
          git push origin HEAD:${GITHUB_REF_NAME}
